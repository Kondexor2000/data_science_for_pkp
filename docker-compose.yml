services:
  api:
    build:
      context: .
      dockerfile: webapi/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      Security__BackupKey: ${SECURITY_BACKUP_KEY:-}
      Security__AdminLogins: ${SECURITY_ADMIN_LOGINS:-}
    volumes:
      - api-data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-8082}:80"

volumes:
  api-data:
