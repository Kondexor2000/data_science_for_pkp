[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "server-activity-analysis"
version = "0.1.0"
description = "MVP do analizy czasu graczy na TeamSpeak i serwerach gier"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
server-activity = "server_activity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
