[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pila-poznan-train-analysis"
version = "0.1.0"
description = "MVP do porównania czasu przejazdu pociągów na trasie Piła–Poznań–Wrocław z przesiadką w Poznaniu"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
train-analysis = "train_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
